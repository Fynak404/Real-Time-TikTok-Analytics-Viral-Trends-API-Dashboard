<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JNX Global - API Status Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="glass-panel p-8 rounded-xl shadow-2xl w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center text-blue-400">API Status & Inloggen</h2>
        
        <!-- Login / API Key Input -->
        <div class="mb-4">
            <label class="block text-sm font-semibold mb-2 text-gray-300">RapidAPI Key</label>
            <input type="password" id="apiKey" placeholder="Vul je RapidAPI Key in..." 
                   class="w-full p-3 rounded bg-slate-800 border border-slate-600 focus:outline-none focus:border-blue-500 text-white placeholder-gray-500">
        </div>
        
        <button onclick="checkApiStatus()" id="loginBtn" 
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded transition duration-200">
            Check Status (Zonder verbruik)
        </button>

        <!-- Dashboard Resultaten (Standaard verborgen) -->
        <div id="dashboard" class="mt-8 hidden">
            <div class="border-t border-slate-600 pt-6">
                <h3 class="text-xl font-semibold mb-4 text-center">Jouw Huidige Status</h3>
                
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-slate-800 p-4 rounded-lg text-center border border-slate-700">
                        <p class="text-xs text-gray-400 uppercase tracking-wide">Actieve Tier</p>
                        <p id="tierDisplay" class="text-xl font-bold text-green-400 mt-1">-</p>
                    </div>
                    
                    <div class="bg-slate-800 p-4 rounded-lg text-center border border-slate-700">
                        <p class="text-xs text-gray-400 uppercase tracking-wide">Requests Over</p>
                        <p id="requestsDisplay" class="text-xl font-bold text-blue-400 mt-1">-</p>
                    </div>
                </div>

                <div class="mt-4 bg-slate-800 p-4 rounded-lg text-center border border-slate-700">
                    <p class="text-xs text-gray-400 uppercase tracking-wide">Totale Limiet</p>
                    <p id="limitDisplay" class="text-lg font-bold text-gray-200 mt-1">-</p>
                </div>
            </div>
        </div>
        
        <!-- Error message -->
        <p id="errorMsg" class="text-red-400 text-sm mt-4 text-center hidden"></p>
    </div>

    <script>
        // Logica om de dichtstbijzijnde Tier te berekenen
        function determineTier(limitStr) {
            const limit = parseInt(limitStr, 10);
            
            // Als er geen geldige limiet is gevonden
            if (isNaN(limit) || limit <= 0) return "ONBEKEND";

            // Jouw exacte tiers
            const tiers = [
                { name: "BASIC", value: 10 },
                { name: "PRO", value: 750 },
                { name: "ULTRA", value: 1500 },
                { name: "MEGA", value: 5000 }
            ];

            let closestTier = tiers[0];
            let smallestDifference = Math.abs(limit - closestTier.value);

            // Loop door de tiers en zoek degene met het minste verschil (dichtstbijzijnde)
            for (let i = 1; i < tiers.length; i++) {
                let currentDifference = Math.abs(limit - tiers[i].value);
                if (currentDifference < smallestDifference) {
                    smallestDifference = currentDifference;
                    closestTier = tiers[i];
                }
            }

            return closestTier.name;
        }

        async function checkApiStatus() {
            const apiKey = document.getElementById('apiKey').value;
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            const dashboard = document.getElementById('dashboard');

            if (!apiKey) {
                errorMsg.innerText = "Vul aub een API key in bro!";
                errorMsg.classList.remove('hidden');
                return;
            }

            // Reset UI
            errorMsg.classList.add('hidden');
            dashboard.classList.add('hidden');
            btn.innerText = "Bezig met checken...";
            btn.disabled = true;

            try {
                // VERVANG DIT door jouw basis RapidAPI URL of een /health endpoint
                const apiUrl = 'https://jouw-jnx-api-host.p.rapidapi.com/v1/ping'; 

                // We gebruiken methode HEAD. Dit haalt ALLEEN de headers op.
                // Dit triggert geen zware backend requests en verbruikt vaak geen data-quota (afhankelijk van setup).
                const response = await fetch(apiUrl, {
                    method: 'HEAD', 
                    headers: {
                        'X-RapidAPI-Key': apiKey,
                        'X-RapidAPI-Host': 'jouw-jnx-api-host.p.rapidapi.com' // Zorg dat dit klopt!
                    }
                });

                if (!response.ok && response.status !== 429) {
                    throw new Error("Ongeldige API Key of endpoint fout.");
                }

                // Haal de headers op die RapidAPI injecteert
                const limitHeader = response.headers.get('x-ratelimit-requests-limit') || '0';
                const remainingHeader = response.headers.get('x-ratelimit-requests-remaining') || '0';

                // Bepaal de Tier op basis van jouw regels (dichtstbijzijnde waarde)
                const currentTier = determineTier(limitHeader);

                // Update de UI
                document.getElementById('tierDisplay').innerText = currentTier;
                document.getElementById('requestsDisplay').innerText = remainingHeader;
                document.getElementById('limitDisplay').innerText = limitHeader;

                dashboard.classList.remove('hidden');

            } catch (error) {
                errorMsg.innerText = error.message;
                errorMsg.classList.remove('hidden');
            } finally {
                btn.innerText = "Check Status (Zonder verbruik)";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
